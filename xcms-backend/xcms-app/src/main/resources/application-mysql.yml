# 生产/联调 Profile： -Dspring.profiles.active=mysql
# 前提：数据库已执行 db/ddl 下的建表脚本；此处 ddl-auto 使用 validate 仅做校验，
# 禁止自动改表，保证线上表结构与 DDL 一致。
spring:
  datasource:
    url: ${XCMS_DB_URL:jdbc:mysql://localhost:3306/xcms?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${XCMS_DB_USERNAME:xcms}
    password: ${XCMS_DB_PASSWORD:xcms}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

xcms:
  identity:
    jwt:
      # 生产/联调环境必须通过环境变量注入密钥；未设置 XCMS_JWT_SECRET 将启动失败，
      # 防止误用硬编码默认值导致密钥泄露。
      secret: ${XCMS_JWT_SECRET}

# 开发 profile 启用 OpenAPI 文档与 Swagger UI
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
