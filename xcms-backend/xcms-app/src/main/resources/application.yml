spring:
  application:
    name: xcms
  profiles:
    # 默认使用 h2（内存库，create-drop），可无需外部依赖直接启动。
    # 生产/联调请切换为 mysql： -Dspring.profiles.active=mysql
    active: h2
  jpa:
    # 关闭 OSIV：避免在请求入口（租户上下文尚未确定时）提前开启 Hibernate 会话，
    # 导致 @TenantId 会话租户被冻结为默认 0，从而使登录等需在事务内设置租户的场景查不到数据。
    open-in-view: false
    properties:
      hibernate:
        # 单库多租户：@TenantId 作为列隔离（DISCRIMINATOR），
        # 而非独立数据源（DATABASE）。显式声明以覆盖 Spring Boot 因
        # CurrentTenantIdentifierResolver 自动推断出的 DATABASE 模式。
        multiTenancy: DISCRIMINATOR
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    # 默认关闭；开发 profile（h2/mysql）启用
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

xcms:
  web:
    cors:
      # 允许的前端源（生产请改为具体域名，多个用逗号分隔）
      allowed-origins: "*"
  identity:
    jwt:
      # 与 identity 模块保持一致；生产请通过环境变量覆盖
      secret: ${XCMS_JWT_SECRET:xcms-jwt-default-secret-key-2026-07-25!}
      access-ttl-seconds: 7200
      refresh-ttl-seconds: 604800
