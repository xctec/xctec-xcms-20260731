# 本地开发 Profile（默认）。使用 H2 文件库（./data/xcms），数据持久化，无需外部数据库。
# ddl-auto=update：自动更新表结构并保留已有数据。联调/生产请使用 mysql profile。
spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/xcms;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

# 开发 profile 启用 OpenAPI 文档与 Swagger UI
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
